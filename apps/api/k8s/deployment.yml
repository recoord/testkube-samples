apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: testkube-api
          image: testkube-samples-api
          imagePullPolicy: Always
          ports:
            - name: testkube-api
              containerPort: 8080
          env:
            - name: DB_HOST
              value: "localhost"
            - name: DB_PORT
              value: "5432"
        - name: db
          image: postgres
          imagePullPolicy: Always
          ports:
            - name: postgres-port
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "api-db"
            - name: POSTGRES_USER
              value: api-user
            - name: POSTGRES_PASSWORD
              value: api-password