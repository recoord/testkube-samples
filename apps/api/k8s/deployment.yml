apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: testkube-api
          image: testkube-samples-api
          imagePullPolicy: Always
          ports:
            - name: testkube-api
              containerPort: 8080